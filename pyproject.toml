[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "genus-zero-simple-knots-verifier"
version = "0.1.0"
description = "Exhaustive verifier for genus-zero simple knots in lens spaces"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Shiyu Liang" },
]
dependencies = [
  "numpy>=1.26",
  "pyarrow>=15",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
g0sv = "g0sv.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
